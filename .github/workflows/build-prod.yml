name: Release

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    create-release:
        name: Build and Create Tagged Release
        runs-on: ubuntu-latest
        steps:
            - name: Install archive tools
              run: sudo apt install zip

            - name: Checkout source code
              uses: actions/checkout@v2
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.repository.default_branch }}

            - name: Setup bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: cd web && bun install

            - name: Run build
              run: bun run build
              working-directory: web
              env:
                  CI: false

            - name: Update tag ref
              uses: EndBug/latest-tag@latest
              with:
                  ref: ${{ github.ref_name }}

            - name: Bundle files
              run: |
                  ls
                  mkdir -p ./temp/q-hud
                  mkdir -p ./temp/q-hud/web/
                  cp ./{LICENSE,README.md,fxmanifest.lua,require.lua} ./temp/q-hud
                  cp -r ./{client,config,data,modules,server,stream} ./temp/q-hud
                  cp -r ./dist ./temp/q-hud/
                  cd ./temp && zip -r ../q-hud.zip ./q-hud

            - name: Create Release
              uses: "marvinpinto/action-automatic-releases@v1.2.1"
              id: auto_release
              with:
                  repo_token: "${{ secrets.GITHUB_TOKEN }}"
                  title: ${{ env.RELEASE_VERSION }}
                  prerelease: false
                  files: q-hud.zip

              env:
                  CI: false
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
